<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <link rel = "stylesheet" th:href="@{css/login.css}">
    <title>Login</title>

</head>
<body>


<article class="logo-containter">
    <img src = "/images/bailando.png" width = "350" height = "400"></img>
</article>

<div class = "login-containter">
    <h1>Login</h1>
<form th:action="@{/}" method="post">
    <div>
        <label for="username">Username</label>
        <input id="username"
               type="text"
               name="username"
               required
        >
    </div>
    <label for="password">Password</label>
    <input id="password"
           type="password"
           name="password"
           required
        >

    <br>

    <button type="submit">Log in</button>
</form>
</div>




<p th:if="${message}" th:text = "${message}"> </p>
</body>
</html>
